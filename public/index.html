<script type="module">

    function box(name, x, y, z, sx, sy, sz, material, cast = true) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),

  );

  mesh.castShadow = cast;

  // Register solid objects, but not floors, ceilings, or outdoor scenery.
  const nonSolid = [
    "floor",
    "ceiling",
    "outdoor ground",
    "pool"
  ];

  if (!nonSolid.includes(name)) {
    addCollision(mesh);
  }

  return mesh;
}

   // Casino tables: Roulette, Blackjack, and Craps
    
    function createTableLayout(type) {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 640;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = type === "blackjack" ? "#174f70" : "#176447";
      ctx.fillRect(0, 0, 1024, 640);

      ctx.strokeStyle = "#e5d2a0";
      ctx.lineWidth = 5;
      ctx.strokeRect(14, 14, 996, 612);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (type === "roulette") {
        ctx.font = "bold 30px Georgia";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("ROULETTE", 512, 52);

        const numbers = [
          [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36],
          [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35],
          [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34]
        ];

        const redNumbers = new Set([
          1, 3, 5, 7, 9, 12, 14, 16, 18,
          19, 21, 23, 25, 27, 30, 32, 34, 36
        ]);

        const startX = 85;
        const startY = 105;
        const cellW = 65;
        const cellH = 105;

        // The single green zero
        ctx.fillStyle = "#168044";
        ctx.fillRect(20, startY, 62, cellH * 3);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 34px Georgia";
        ctx.fillText("0", 51, startY + cellH * 1.5);

        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 12; col++) {
            const n = numbers[row][col];
            const x = startX + col * cellW;
            const y = startY + row * cellH;

            ctx.fillStyle = redNumbers.has(n) ? "#b82130" : "#17191d";
            ctx.fillRect(x, y, cellW - 2, cellH - 2);

            ctx.strokeStyle = "#e5d2a0";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, cellW - 2, cellH - 2);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 27px Georgia";
            ctx.fillText(String(n), x + cellW / 2, y + cellH / 2);
          }
        }

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 27px Georgia";
        ctx.fillText("2 TO 1", 510, 460);
        ctx.fillText("RED", 220, 520);
        ctx.fillText("BLACK", 410, 520);
        ctx.fillText("EVEN", 600, 520);
        ctx.fillText("ODD", 790, 520);
      }

      if (type === "blackjack") {
        ctx.fillStyle = "#f0d8a0";
        ctx.font = "bold 52px Georgia";
        ctx.fillText("BLACKJACK", 512, 90);

        ctx.font = "bold 27px Georgia";
        ctx.fillText("DEALER", 512, 180);

        // Dealer card illustrations
        for (let i = 0; i < 2; i++) {
          const x = 445 + i * 75;
          ctx.fillStyle = "#f7f2e8";
          ctx.fillRect(x, 215, 64, 92);
          ctx.strokeStyle = "#c9b98e";
          ctx.lineWidth = 3;
          ctx.strokeRect(x, 215, 64, 92);

          ctx.fillStyle = i === 0 ? "#b82130" : "#17191d";
          ctx.font = "bold 29px Georgia";
          ctx.fillText(i === 0 ? "A" : "K", x + 32, 260);
        }

        ctx.strokeStyle = "#e5d2a0";
        ctx.lineWidth = 5;

        for (let i = 0; i < 5; i++) {
          const x = 150 + i * 180;
          ctx.beginPath();
          ctx.ellipse(x, 485, 66, 46, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = "#f0d8a0";
          ctx.font = "bold 23px Georgia";
          ctx.fillText("BET", x, 485);
        }

        ctx.font = "bold 25px Georgia";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("INSURANCE", 512, 380);
      }

      if (type === "craps") {
        ctx.fillStyle = "#f0d8a0";
        ctx.font = "bold 50px Georgia";
        ctx.fillText("CRAPS", 512, 70);

        ctx.strokeStyle = "#e5d2a0";
        ctx.lineWidth = 4;

        // Main central betting area
        ctx.strokeRect(220, 125, 584, 360);
        ctx.beginPath();
        ctx.moveTo(220, 305);
        ctx.lineTo(804, 305);
        ctx.moveTo(512, 125);
        ctx.lineTo(512, 485);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 36px Georgia";
        ctx.fillText("PASS LINE", 512, 155);
        ctx.fillText("COME", 365, 245);
        ctx.fillText("DON'T COME", 660, 245);
        ctx.fillText("FIELD", 365, 365);
        ctx.fillText("PLACE BETS", 660, 365);
        ctx.fillText("PASS LINE", 512, 455);

        ctx.font = "bold 25px Georgia";
        ctx.fillText("4   5   6   8   9   10", 512, 535);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }
  function createRouletteWheel(x, z) {
  const wheel = new THREE.Group();

  // Position the wheel on the roulette table
  wheel.position.set(x - 0.85, 1.59, z);
 
  // Gold outer rim
  const rim = new THREE.Mesh(
    new THREE.CylinderGeometry(0.76, 0.76, 0.14, 48),
    materials.gold
  );
  wheel.add(rim);

  // Dark wooden wheel body
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.67, 0.67, 0.14, 48),
    materials.dark
  );
  body.position.y = -0.08;
  wheel.add(body);

  // Numbered red, black, and green pockets
  const redNumbers = new Set([
    1, 3, 5, 7, 9, 12, 14, 16, 18,
    19, 21, 23, 25, 27, 30, 32, 34, 36
  ]);

  for (let i = 0; i < 37; i++) {
    const angle = (i / 37) * Math.PI * 2;
    const color =
      i === 0 ? "#168044" :
      redNumbers.has(i) ? "#b82130" : "#17191d";

    const pocket = new THREE.Mesh(
      new THREE.BoxGeometry(0.085, 0.035, 0.16),
      mat(color, 0.45)
    );

    pocket.position.set(
      Math.sin(angle) * 0.48,
      0.015,
      Math.cos(angle) * 0.48
    );

    pocket.rotation.y = angle;
    wheel.add(pocket);

    // Small gold number markers
    const number = new THREE.Mesh(
      new THREE.BoxGeometry(0.045, 0.012, 0.07),
      materials.gold
    );

    number.position.set(
      Math.sin(angle) * 0.48,
      0.04,
      Math.cos(angle) * 0.48
    );

    number.rotation.y = angle;
    wheel.add(number);
  }

  // Raised gold center
  const spindle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14, 0.22, 0.18, 24),
    materials.gold
  );
  spindle.position.y = 0.06;
  wheel.add(spindle);

  const center = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 20, 16),
    materials.gold
  );
  center.position.y = 0.16;
  wheel.add(center);

  scene.add(wheel);
  return wheel;
}
    function casinoTable(x, z, type) {
  const isCraps = type === "craps";
  const isRoulette = type === "roulette";

    const layout = new THREE.Mesh(

        side: THREE.DoubleSide
      })
    );

    layout.position.set(x, 1.118, z);
    scene.add(layout);

  } else if (isRoulette) {
    
    // rectangle roulette table:
    // rounded corners with room for the wheel and betting layout

    box("roulette left pedestal", x - 0.55, 0.65, z, 1.5, 1.3, 1.5, materials.dark);
    box("roulette right pedestal", x + 1.1, 0.65, z, 2.0, 1.3, 1.5, materials.dark);

// Create a rounded rectangle shape for the roulette table
    function roundedRectShape(width, height, radius) {
      const shape = new THREE.Shape();

      const left = -width / 2;
      const right = width / 2;
      const top = height / 2;
      const bottom = -height / 2;

      radius = Math.min(radius, width / 2, height / 2);

      shape.moveTo(left + radius, bottom);
      shape.lineTo(right - radius, bottom);
      shape.quadraticCurveTo(right, bottom, right, bottom + radius);
      shape.lineTo(right, top - radius);
      shape.quadraticCurveTo(right, top, right - radius, top);
      shape.lineTo(left + radius, top);
      shape.quadraticCurveTo(left, top, left, top - radius);
      shape.lineTo(left, bottom + radius);
      shape.quadraticCurveTo(left, bottom, left + radius, bottom);

      return shape;
    }

    // Gold rounded outer rim
    const tableShape = roundedRectShape(4.8, 3.0, 0.55);
    const rimGeometry = new THREE.ExtrudeGeometry(tableShape, {
      depth: 0.16,
      bevelEnabled: false,
      curveSegments: 12
    });

    const rim = new THREE.Mesh(rimGeometry, materials.gold);
    rim.rotation.x = -Math.PI / 2;
    rim.position.set(x, 1.34, z);
    scene.add(rim);

    // Rounded felt inset inside the rim
    const feltShape = roundedRectShape(4.48, 2.68, 0.42);
    const feltGeometry = new THREE.ShapeGeometry(feltShape, 12);

    const felt = new THREE.Mesh(feltGeometry, topMat);
    felt.rotation.x = -Math.PI / 2;
    felt.position.set(x, 1.505, z);
    scene.add(felt);    
    
    // Betting layout on the rectangular right side
    const layout = new THREE.Mesh(
      new THREE.PlaneGeometry(2.0, 2.1),
      new THREE.MeshBasicMaterial({
        map: createTableLayout(type),
        side: THREE.DoubleSide
      })
    );
    layout.rotation.x = -Math.PI / 2;
    layout.position.set(x + 0.95, 1.515, z);
    scene.add(layout);

    // One wheel, positioned in the round left section
    createRouletteWheel(x, z);

  } else {
    // Standard blackjack table
    box("table pedestal", x, 0.65, z, 1.1, 1.3, 1.1, materials.dark);
    box("table rim", x, 1.35, z, 4.2, 0.25, 2.8, materials.gold);
    box("felt top", x, 1.5, z, 3.95, 0.12, 2.55, topMat);

    const layout = new THREE.Mesh(
      new THREE.PlaneGeometry(3.85, 2.45),
      new THREE.MeshBasicMaterial({
        map: createTableLayout(type),
        side: THREE.DoubleSide
      })
    );
    layout.rotation.x = -Math.PI / 2;
    layout.position.set(x, 1.565, z);
    scene.add(layout);
  }

  // Chairs around every table
  for (let i = -1; i <= 1; i++) {
    box(
      "casino chair",
      x + i * 2,
      0.55,
      z + 2.4,
      1.05,
      1.1,
      0.8,
      materials.red
    );
  }
}

    // Slot machine game logic
const slotMessage = document.querySelector("#slotMessage");

let activeSpin = null;
let messageTimer = null;

function playSlotMachine(machine) {
  if (activeSpin) return;

  clearTimeout(messageTimer);
  slotMessage.style.display = "block";
  slotMessage.textContent = "🎰 Spinning...";

  const startTime = performance.now();
  const spinDuration = 1800;

  const symbols = {
    Cherry: "🍒",
    Lemon: "🍋",
    Diamond: "💎",
    Clover: "🍀",
    Seven: "7️⃣"
  };

  function updateReel(reel, result) {
    reel.material.color.set(result.color);

    const ctx = reel.userData.symbolContext;
    ctx.clearRect(0, 0, 256, 256);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 256, 256);

    ctx.font = "150px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(symbols[result.name], 128, 128);

    reel.userData.symbolTexture.needsUpdate = true;
  }

  activeSpin = {
    update(delta) {
      const elapsed = performance.now() - startTime;

      if (elapsed < spinDuration) {
        machine.reels.forEach((reel) => {
          const symbol =
            slotSymbols[
              Math.floor(Math.random() * slotSymbols.length)
            ];

          updateReel(reel, symbol);
        });

        return;
      }

      const results = machine.reels.map(() =>
        slotSymbols[
          Math.floor(Math.random() * slotSymbols.length)
        ]
      );

      machine.reels.forEach((reel, i) => {
        updateReel(reel, results[i]);
      });

      if (results.every(s => s.name === results[0].name)) {
        slotMessage.textContent =
          `🎉 JACKPOT! ${results[0].name} × 3!`;
      } else if (
        results[0].name === results[1].name ||
        results[1].name === results[2].name ||
        results[0].name === results[2].name
      ) {
        slotMessage.textContent = "✨ Two match! Nice!";
      } else {
        slotMessage.textContent = "No match! Try again.";
      }

      activeSpin = null;

      messageTimer = setTimeout(() => {
        slotMessage.style.display = "none";
      }, 3500);
    }
  };
}

        remotePlayers.set(id, avatar);

      if (id === socket.id || remotePlayers.has(id)) return;
      const avatar = makeAvatar(player.color);
      avatar.position.set(player.x, 0, player.z);
      remotePlayers.set(id, avatar);
      updatePlayerCount();
    });

    socket.on("playerMoved", ({ id, player }) => {
      const avatar = remotePlayers.get(id);
      if (!avatar) return;
      avatar.position.set(player.x, 0, player.z);
      avatar.rotation.y = player.rotation;
    });

    socket.on("playerLeft", (id) => {
      const avatar = remotePlayers.get(id);
      if (avatar) {
        scene.remove(avatar);
        remotePlayers.delete(id);
        updatePlayerCount();
      }
    });
